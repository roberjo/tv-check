name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools (locked versions)
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          pip install -r requirements-dev.txt
      - name: Versions agree (manifest, CHANGELOG)
        run: python3 scripts/bump_version.py --check
      - name: Fixtures are up to date
        run: |
          python3 daybreak/tests/make_fixtures.py
          git diff --exit-code daybreak/tests/fixtures/feeds
      - name: Library tests
        run: sh daybreak/tests/run.sh
      - name: Data and screen tests
        run: sh daybreak/tests/run_data.sh
      - name: BrighterScript
        run: python3 daybreak/build_channel.py --check
      - name: pyflakes
        run: pyflakes scripts daybreak/build_channel.py daybreak/tests daybreak/art daybreak/preview
      - name: Design audit (every screen from the TV code; 24 px minimum, WCAG contrast)
        run: |
          python3 daybreak/build_channel.py --assets
          mkdir -p .venv/bin && ln -sf "$(command -v python3)" .venv/bin/python
          sh daybreak/preview/preview.sh "$RUNNER_TEMP/preview" --audit
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screen-previews
          path: ${{ runner.temp }}/preview/*.png
          retention-days: 14

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: npm audit (dev tools)
        run: npm audit --audit-level=moderate
      - name: pip-audit (dev tools)
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements-dev.txt

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
