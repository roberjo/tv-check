name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools (locked versions)
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          pip install -r requirements-dev.txt
      - name: Versions agree (manifest, CHANGELOG)
        run: python3 scripts/bump_version.py --check
      - name: Fixtures are up to date
        run: |
          python3 daybreak/tests/make_fixtures.py
          git diff --exit-code daybreak/tests/fixtures/feeds
      - name: Library tests
        run: sh daybreak/tests/run.sh
      - name: Data and screen tests
        run: sh daybreak/tests/run_data.sh
      - name: BrighterScript
        run: python3 daybreak/build_channel.py --check
      - name: pyflakes
        run: pyflakes scripts daybreak/build_channel.py daybreak/tests daybreak/art daybreak/preview
      - name: Design audit (every screen from the TV code; 24 px minimum, WCAG contrast)
        run: |
          python3 daybreak/build_channel.py --assets
          mkdir -p .venv/bin && ln -sf "$(command -v python3)" .venv/bin/python
          sh daybreak/preview/preview.sh "$RUNNER_TEMP/preview" --audit
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-previews
          path: ${{ runner.temp }}/preview/*.png
          retention-days: 14

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: npm audit (dev tools)
        run: npm audit --audit-level=moderate
      - name: pip-audit (dev tools)
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r requirements-dev.txt

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
