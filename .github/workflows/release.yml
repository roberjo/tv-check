name: Release

# Push a tag made by scripts/bump_version.py (vMAJOR.MINOR.PATCH) to run every
# check, build the public demo package and publish the GitHub release.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          pip install -r requirements-dev.txt
      - name: Tag matches the manifest and CHANGELOG
        run: python3 scripts/bump_version.py --check "$GITHUB_REF_NAME"
      - name: Build the public demo package (fictional family, no .env)
        run: |
          python3 daybreak/build_channel.py --demo
          V="${GITHUB_REF_NAME#v}"
          mv daybreak/dist/daybreak-demo.zip "daybreak/dist/daybreak-demo-$V.zip"
          (cd daybreak/dist && sha256sum "daybreak-demo-$V.zip" > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: daybreak/dist/daybreak-demo-*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          python3 scripts/bump_version.py --notes "$V" > notes.md
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n 2p)
          printf '\n\n**Demo package:** `daybreak-demo-%s.zip` uses the fictional family and no calendar. Build your own with `daybreak/build_channel.py` for your household.\n\n**Full changelog:** https://github.com/%s/compare/%s...%s\n' "$V" "$GITHUB_REPOSITORY" "$PREV" "$GITHUB_REF_NAME" >> notes.md
          TITLE="Daybreak $V"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" daybreak/dist/daybreak-demo-*.zip daybreak/dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file notes.md --verify-tag \
              daybreak/dist/daybreak-demo-*.zip daybreak/dist/SHA256SUMS.txt
          fi
